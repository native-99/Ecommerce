# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod
spring.jpa.show-sql=false

# Hide API docs from the public internet
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Trust X-Forwarded-* headers from the hosting platform's proxy (HTTPS, client IP)
server.forward-headers-strategy=framework

# Do not leak stack traces or exception messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never
