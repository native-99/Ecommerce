spring.application.name=Web Ecommerce
# Load local secrets from .env when present (ignored in production, where real env vars are used)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecommerce_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}

# Server Configuration
spring.profiles.active=development
server.port=${PORT:3000}
server.servlet.context-path=/api/v1

# CORS (comma separated frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# flyway config
spring.flyway.enabled=true
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.username=${REDIS_USERNAME:}
redis.password=${REDIS_PASSWORD:}
redis.ssl=${REDIS_SSL:false}

# JWT Configuration
app.jwtSecret=${APP_JWT_SECRET}
app.jwtExpirationTime=3d

#XENDIT
xendit.api-key=${XENDIT_API_KEY:}
xendit.public-key=${XENDIT_PUBLIC_KEY:}
xendit.callback-token=${XENDIT_CALLBACK_TOKEN:}

#SENDGRID
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
email.template.payment-successful.id=${SENDGRID_PAYMENT_SUCCESS_TEMPLATE_ID:}
email.template.payment-unsuccessful.id=${SENDGRID_PAYMENT_ERROR_TEMPLATE_ID:}
email.retrier.max-attempts=3
email.retrier.wait-duration=5s

#rate limiter configuration
rate.limit.default=100
rate.limit.period=60
rate.limit.timeout=1
rate.limit.login.attempts=5
rate.limit.login.period=60
